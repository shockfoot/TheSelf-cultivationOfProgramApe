<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>狠狠踩一脚 - 这是我的世界</title>
    <link rel="icon" type="image/png" href="Favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="Favicon/favicon.svg" />
    <link rel="shortcut icon" href="Favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="Favicon/apple-touch-icon.png" />
    <link rel="manifest" href="Favicon/site.webmanifest" />

    <link rel="stylesheet" href="CSS/CSS_Initialize.css" />
    <link rel="stylesheet" href="CSS/CSS_Common.css" />
    <link rel="stylesheet" href="CSS/CSS_Custom2.css" />
    <link rel="stylesheet" href="IconFont/iconfont.css" />

    <style>
        /* 移动端导航 */
        .mobileNavLink span {
          margin-right: 0.5rem;
        }
    </style>
  </head>
  <body>
    <div class="fixed w-full h-full bg-image bg-image1 z-n1"></div>
    <nav>
      <div class="desktop-only-f fixed top-0 left-0 w-16 h-full border-box flex-col items-center br-dark-blod bg-light">
        <div class="flex flex-col items-center pb-1 gap-0d5 w-full bb-dark-blod pt-2">
            <img src="./Image/avatar_t.png" alt="狠狠踩一脚" title="狠狠踩一脚" class="w-4 h4" />
            <p class="text-blod text-2d5 line-4">狠狠踩一脚</p>
        </div>
        <div class="flex-auto w-full bb-dark-blod relative" style="overflow-y: auto; overflow-x: hidden;">
            <div class="absolute br-shallow left-2 top-0 bottom-0 z-n1" style="width: 2px"></div>
            <div>
                <a id="desktopGen" href="#gen" class="flex h-5 line-5 bb-dark relative desktopNavLink activeDesktopNavLink" data-type="gen"><p class="w-2 text-0d75 text-center">01</p><p class="iconfont icon-card w-4 text-center text-blod"></p><p class="flex-auto text-blod">情报</p></a>
                <a id="desktopArchvie" href="#archive" class="flex h-5 line-5 bb-dark relative desktopNavLink" data-type="archive"><p class="w-2 text-0d75 text-center">02</p><p class="iconfont icon-paper w-4 text-center text-blod"></p><p class="flex-auto text-blod">档案</p></a>
                <a id="desktopWarehouse" href="#warehouse" class="flex h-5 line-5 bb-dark relative desktopNavLink" data-type="warehouse"><p class="w-2 text-0d75 text-center">03</p><p class="iconfont icon-folder w-4 text-center text-blod"></p><p class="flex-auto text-blod">仓库</p></a>
            </div>
        </div>
        <div class="w-full pb-2 flex flex-col gap-1 pt-1 items-center" style="height: 8rem;">
          <div class="grid grid-2 gap-2 rgap-1">
            <a href="https://space.bilibili.com/95120665?spm_id_from=333.1007.0.0" target="_blank" class="flex flex-col px-0d5 py-0d5 items-center gap-0d5 ba-dark w-4 shadow hover-scale">
              <p class="iconfont icon-time text-blod"></p>
              <p class="text-0d75 text-blod text-red">BiliBili</p>
            </a>
            <a href="https://github.com/shockfoot" target="_blank" class="flex flex-col px-0d5 py-0d5 items-center gap-0d5 ba-dark w-4 shadow hover-scale">
              <p class="iconfont icon-time text-blod"></p>
              <p class="text-0d75 text-blod text-red">GitHub</p>
            </a>
          </div>
          <div class="bb-dark" style="width: 12rem;"></div>
          <a href="https://beian.miit.gov.cn" title="工业和信息化部ICP/IP地址/域名信息备案管理系统" target="_blank" class="w-full text-0d75 text-center text-middle">&copy;&nbsp;2025&nbsp;狠狠踩一脚&nbsp;&verbar;&nbsp;皖ICP备2022009674号-1</a>
        </div>
      </div>
      <div class="mobile-only-f fixed top-0 left-0 w-full h-4 justify-between items-center px-2 border-box bb-dark-blod bg-light" >
        <div class="flex items-center">
          <img
            src="./Image/avatar.png"
            alt="狠狠踩一脚"
            ,
            title="狠狠踩一脚"
            class="w-2 h2 mr-0d5"
          />
          <p class="text-blod text-1d25">狠狠踩一脚</p>
        </div>
        <div class="flex items-center">
            <a id="mobileGen" href="#gen" class="box-block ml-1 px-0d5 text-blod" data-type="gen"><span class="iconfont icon-card mr-0d5"></span>情报</a>
            <a id="mobileArchvie" href="#archive" class="box-block ml-1 px-0d5 text-blod" data-type="archive"><span class="iconfont icon-paper mr-0d5"></span>档案</a>
            <a id="mobileWarehouse" href="#warehouse" class="box-block ml-1 px-0d5 text-blod" data-type="warehouse"><span class="iconfont icon-folder mr-0d5"></span>仓库</a>
        </div>
      </div>
    </nav>
    <div id="contentContainer" class="mobile-container"></div>
    <script>
      // 导航
      const contentMap = {
        'gen': '<h2 class="pixel-title">欢迎来到我的像素世界</h2>',
        'archive': '<h2 class="pixel-title">游戏作品</h2>',
        'warehouse': '<h2 class="pixel-title">绘画作品</h2>'
      };

      const desktopNavLinks = [
        document.getElementById('desktopGen'),
        document.getElementById('desktopArchvie'),
        document.getElementById('desktopWarehouse')
      ];
      desktopNavLinks.forEach(link => link.addEventListener('click', handleDesktopNavLinkClick));
      const mobileNavLinks= [
        document.getElementById('mobileGen'),
        document.getElementById('mobileArchvie'),
        document.getElementById('mobileWarehouse')
      ];
      mobileNavLinks.forEach(link => link.addEventListener('click', handleDesktopNavLinkClick));
      const contentContainer = document.getElementById('contentContainer')
      contentContainer.innerHTML = contentMap['gen'];

      function handleDesktopNavLinkClick(e) {
        e.preventDefault();
        //console.log(this.innerHTML);
        desktopNavLinks.forEach(link => link.classList.remove('activeDesktopNavLink'));
        this.classList.add('activeDesktopNavLink');
        contentContainer.innerHTML = contentMap[this.dataset.type];
      }
    </script>
  </body>
</html>
