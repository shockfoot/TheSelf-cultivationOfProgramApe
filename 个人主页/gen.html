    <div id="script-module" data-src="./JS/gen.js"></div>
    <script>
        const scriptModuleID = 'script-module';
        async function loadAndExecuteJS() {
            try {
                const moduleElement = document.getElementById(scriptModuleID);
                if (moduleElement) {
                    const scriptSrc = moduleElement.dataset.src;
                    if (scriptSrc) {
                        const module = await import(scriptSrc);
                        if (!module) throw new Error(`导入模块失败: ${scriptSrc}`);
                        if (module.init) {
                            module.init();
                        }
                    }
                }
            }
            catch (error) {
                console.error(e);
            }
        }
        loadAndExecuteJS();
