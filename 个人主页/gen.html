<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>狠狠踩一脚 - 这是我的世界</title>
    <link rel="icon" type="image/png" href="Favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="Favicon/favicon.svg" />
    <link rel="shortcut icon" href="Favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="Favicon/apple-touch-icon.png" />
    <link rel="manifest" href="Favicon/site.webmanifest" />

    <link rel="stylesheet" href="CSS/css_initialize.css" />
    <link rel="stylesheet" href="CSS/css_common.css" />
    <link rel="stylesheet" href="CSS/css_custom.css" />
    <link rel="stylesheet" href="IconFont/iconfont.css" />
</head>
<body>
    <div id="content">
        <div class="px-4 py-3 w-full min-h-screen border-box bg-light">
            <div class="flex h-content-between v-item-center">
                <p class="genTag genDarkTag">资料</p>
                <p id="nowDate" class="text-blod text-0d75" style="font-family: 'Consolas';"></p>
            </div>
            <p class="h-7 line-7 text-4 text-blod">欢迎来到我的博客!</p>
            <p class="flex v-item-center genTagContainer"><span>#独立游戏</span><span>#C#</span><span>#Unity</span></p>
            <div class="bb-dark-blod h-1"></div>
            <div class="border-box py-2 grid grid-col-2 gap-2 genDescriptionContainer">
                <div class="genDescriptionItem genDescriptionItem-light">
                    <p class="text-1d75 h-3 line-3 text-blod genHoverRed">程序猿的自我修养</p>
                    <p class="pt-0d5 pb-1">专注Unity客户端开发，热衷于造轮子。正在学习像素画和编曲，希望做出自己的游戏。</p>
                    <p class="flex v-item-center gap-1"><span class="genTag genLightTag">程序=数据结构+算法</span><span class="genTag genLightTag">CRUD</span><span class="genTag genLightTag">CV工程师</span></p>
                </div>
                <div class="genDescriptionItem genDescriptionItem-dark">
                    <p class="text-0d75 h-2 line-2 text-blod">技术狂热</p>
                    <div class="bb-dark"></div>
                    <p class="text-blod pt-1 pb-0d5 text-red">如果代码足够优雅，硬件就该为它燃烧！</p>
                    <p class="text-italic text-0d75">“任何傻瓜都能写出计算机理解的代码，而优秀的程序员能写出人类能理解的代码。”——马丁·福勒</p>
                </div>
            </div>
            <div class="flex v-item-center gap-1">
                <div class="w-1 h-1 bg-red"></div>
                <p class="text-1d25 text-blod">技术能力</p>
                <div class="flex-auto" style="border: 1px dashed var(--color-middle);"></div>
            </div>
        </div>
    </div>
    <div id="script-module" data-src="./JS/gen.js"></div>
    <script>
        const scriptModuleID = 'script-module';
        async function loadAndExecuteJS() {
            try {
                const moduleElement = document.getElementById(scriptModuleID);
                if (moduleElement) {
                    const scriptSrc = moduleElement.dataset.src;
                    if (scriptSrc) {
                        const module = await import(scriptSrc);
                        if (!module) throw new Error(`导入模块失败: ${scriptSrc}`);
                        if (module.init) {
                            module.init();
                        }
                    }
                }
            }
            catch (error) {
                console.error(e);
            }
        }
        loadAndExecuteJS();
    </script>
</body>
</html>
