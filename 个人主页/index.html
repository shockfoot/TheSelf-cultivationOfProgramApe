    <style>
      /* #region 桌面端导航头像 */
      .desktopNavLine {
        border-bottom: 2px solid var(--color-dark);
        width: 12rem;
      }
      /* #endregion */
      /* #region 桌面端导航链接 */
      .desktopNavLink {
        display: flex;
        height: 5rem;
        line-height: 5rem;
        border-bottom: 2px solid var(--color-dark);
        position: relative;
        background-color: transparent;
        transition: all var(--duration) ease;
      }
      .desktopNavIndex {
        width: 2rem;
        line-height: 2rem;
        font-size: 0.75rem;
        text-align: center;
        color: var(--color-middle);
        font-family: 'Consolas' ;
      }
      .desktopNavIcon {
        width: 4rem;
        text-align: center;
        font-weight: 700;
      }
      .desktopNavAnimation {
        flood-color: var();
        transition: all var(--duration) ease;
      }
      .desktopNavTitle {
        flex: auto;
        font-weight: 700;
      }
      .desktopNavLink:hover {
        background-color: var(--color-red);
        color: var(--color-light);
      }
      .desktopNavLink:hover .desktopNavIndex {
        color: var(--color-shallow);
      }
      .desktopNavLink:hover .desktopNavAnimation {
        transform: translateX(16px);
      }
      .desktopNavLink.activeDesktopNavLink {
        background-color: var(--color-dark);
        color: var(--color-light);
      }
      .desktopNavLink.activeDesktopNavLink .desktopNavIndex {
        color: var(--color-middle);
      }
      .desktopNavLink.activeDesktopNavLink::after {
        content: "";
        display: block;
        width: 8px;
        height: 100%;
        position: absolute;
        right: 0;
        top: 0;
        background-color: var(--color-red);
      }
      .desktopNavLink.activeDesktopNavLink:hover {
        background-color: var(--color-dark);
        color: var(--color-light);
      }
      .desktopNavLink.activeDesktopNavLink:hover .desktopNavIndex {
        color: var(--color-shallow);
      }
      /* #endregion */
      /* #region 桌面端导航联系方式 */
      .desktopNavMyLink {
        display: flex;
        width: 4rem;
        flex-direction: column;
        padding: 0.5rem;
        align-items: center;
        gap: 0.5rem;
        border: 2px solid var(--color-dark);
        box-shadow: 4px 4px var(--color-dark);
      }
      .desktopNavMyLink p:first-child {
        font-weight: 700;
      }
      .desktopNavMyLink p:last-child {
        font-weight: 700;
        color: var(--color-red);
        font-size: 0.75rem;
      }
      /* #endregion */
      /* #region 移动端导航 */
      .mobileNavLink {
        margin-left: 1rem;
        padding-left: 0.5rem;
        padding-right: 0.5rem;
        font-weight: 700;
      }
      .mobileNavLink span {
        margin-right: 0.5rem;
      }
      /* #endregion */
      /* #region 内容盒子 */
      @media (max-width: 768px) {
        .mobile-container {
          padding-top: 4rem;
          padding-left: 0;
        }
      }
      @media (min-width: 769px) {
        .mobile-container {
          padding-top: 0;
          padding-left: 16rem;
        }
      }
      /* #endregion */
    </style>
  </head>
  <body>

        <div class="flex flex-col v-item-center pb-1 gap-1 w-full bb-dark-blod pt-2">
            <img src="Image/avatar_t.png" alt="狠狠踩一脚" title="狠狠踩一脚" class="w-4 h-4 rounded-full" />
            <h1 class="text-blod text-1d5 line-2">狠狠踩一脚</h1>
            <div class="desktopNavLine"></div>
            <p class="text-red text-blod" style="font-size: 0.9rem;">像花虽未红，如冰虽不冻。</p>
        </div>

            <div class="absolute br-shallow left-2 top-0 bottom-0 z-n1" style="width: 2px"></div>
            <div>
                <a id="desktopGen" href="#gen" class="desktopNavLink activeDesktopNavLink" data-type="gen"><p class="desktopNavIndex">01</p><p class="iconfont icon-card desktopNavIcon desktopNavAnimation"></p><p class="desktopNavTitle desktopNavAnimation">情报</p></a>
                <a id="desktopArchvie" href="#archive" class="desktopNavLink" data-type="archive"><p class="desktopNavIndex">02</p><p class="iconfont icon-paper desktopNavIcon desktopNavAnimation"></p><p class="desktopNavTitle desktopNavAnimation">档案</p></a>
                <a id="desktopWarehouse" href="#warehouse" class="desktopNavLink" data-type="warehouse"><p class="desktopNavIndex">03</p><p class="iconfont icon-folder desktopNavIcon desktopNavAnimation"></p><p class="desktopNavTitle desktopNavAnimation">仓库</p></a>
            </div>
        </div>
        <div class="w-full pb-2 flex flex-col gap-1 pt-1 v-item-center" style="height: 8rem;">
          <div class="grid grid-2 gap-2 rgap-1">
            <a href="https://space.bilibili.com/95120665?spm_id_from=333.1007.0.0" target="_blank" class="desktopNavMyLink hover-scale">

            <a href="https://github.com/shockfoot" target="_blank" class="desktopNavMyLink hover-scale">
              <p class="iconfont icon-time"></p>
              <p>GitHub</p>
            </a>
          </div>
          <div class="desktopNavLine"></div>
          <a href="https://beian.miit.gov.cn" title="工业和信息化部ICP/IP地址/域名信息备案管理系统" target="_blank" class="w-full text-0d75 text-center text-middle">&copy;&nbsp;2025&nbsp;狠狠踩一脚&nbsp;&verbar;&nbsp;皖ICP备2022009674号-1</a>
        </div>
      </div>
      <div class="mobile-only-f fixed top-0 left-0 w-full h-4 h-content-between v-item-center px-2 border-box bb-dark-blod bg-light" >
        <div class="flex v-item-center">
          <img src="./Image/avatar_t.png" alt="狠狠踩一脚", title="狠狠踩一脚" class="w-2 h2 mr-0d5" />
          <p class="text-blod text-1d25">狠狠踩一脚</p>
        </div>
        <div class="flex v-item-center">
            <a id="mobileGen" href="#gen" class="mobileNavLink" data-type="gen"><span class="iconfont icon-card"></span>情报</a>
            <a id="mobileArchvie" href="#archive" class="mobileNavLink" data-type="archive"><span class="iconfont icon-paper"></span>档案</a>
            <a id="mobileWarehouse" href="#warehouse" class="mobileNavLink" data-type="warehouse"><span class="iconfont icon-folder"></span>仓库</a>
        </div>
      </div>
    </nav>
    <div id="contentContainer" class="mobile-container"></div>
    <script>
      // 导航
      let isLoading = false;
      const contentID = 'content';
      const scriptModuleID = 'script-module';
      const navLinkURLMap = {
        'gen': 'gen.html',
        'archive': 'archive.html',
        'warehouse': 'warehouse.html'
      };

      const desktopNavLinks = [
        document.getElementById('desktopGen'),
        document.getElementById('desktopArchvie'),
        document.getElementById('desktopWarehouse')
      ];
      desktopNavLinks.forEach(link => link.addEventListener('click', handleDesktopNavLinkClick));
      const mobileNavLinks= [
        document.getElementById('mobileGen'),
        document.getElementById('mobileArchvie'),
        document.getElementById('mobileWarehouse')
      ];
      mobileNavLinks.forEach(link => link.addEventListener('click', handleDesktopNavLinkClick));
      const contentContainer = document.getElementById('contentContainer')
      loadHTMLContent('gen');

      async function handleDesktopNavLinkClick(e) {
        e.preventDefault();
        if (isLoading || this.classList.contains('activeDesktopNavLink')) return;
        desktopNavLinks.forEach(link => link.classList.remove('activeDesktopNavLink'));
        this.classList.add('activeDesktopNavLink');
        await loadHTMLContent(this.dataset.type)
      }
      async function loadHTMLContent(type) {
        isLoading = true;
        const filepath = navLinkURLMap[type];
        console.log(filepath);
        try {
          const response = await fetch(filepath);
          if (!response.ok) throw new Error(`请求失败: ${response.status}`);
          const htmlContent = await response.text();
          const parser = new DOMParser();
          const htmlDoc = parser.parseFromString(htmlContent, 'text/html');
          const container = htmlDoc.getElementById(contentID);
          if (!container) throw new Error(`未找到内容: ${contentID}`);
          contentContainer.innerHTML = container.innerHTML;

          const moduleElement = htmlDoc.getElementById(scriptModuleID);
          if (moduleElement) {
            const scriptSrc = moduleElement.dataset.src;
            if (scriptSrc) {
              const module = await import(scriptSrc);
              if (!module) throw new Error(`导入模块失败: ${scriptSrc}`);
              if (module.init) {
                module.init();
              }
            }
          }
        }
        catch (error) {
          console.error(`加载${filepath}失败: ${error}`);
          contentContainer.innerHTML = `<div>加载失败: ${error.message}</div>`;
        }
        finally {
          isLoading = false;
        }
      }

      //const fadeElements = document.querySelectorAll('.fade-in');

      //  entries.forEach(entry => {
      //    if (entry.isIntersecting) {
      //      entry.target.classList.add('show');
      //    }
      //  });
      //}, { threshold: 0.1 });
      //fadeElements.forEach(el => fadeInObserver.observe(el));
    </script>
