            <h2 class="blue">Void</h2>
            <div id="Description">
                <h3>描述</h3>
                <ul>
                    <li>定义：<i>public struct Void</i></li>
                    <li>命名空间：System</li>
                    <li>程序集：System.Runtime.dll</li>
                </ul>
                <p>Void指空类型，主要用于方法返回值。除了System.Reflection命名空间外，不会在代码中使用之。</p>
                <p>除了所有从Object类继承的成员之外，Void没有其他额外成员。</p>
